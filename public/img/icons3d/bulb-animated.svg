<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -70 1160 1140"><style>@keyframes drive{0%,100%{transform:translateX(-23px) rotate(-.6deg)}50%{transform:translateX(23px) rotate(.6deg)}}@keyframes wave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes flutter{0%,100%{transform:skewY(-1.5deg) scaleX(.99)}50%{transform:skewY(2deg) scaleX(1.015)}}@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes glow{0%,100%{opacity:.12}50%{opacity:.6}}@keyframes rays{0%,12%,82%,100%{opacity:1}28%,58%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.halo{opacity:.2!important}}</style><defs><g id="source"><svg width="1000" height="1000" viewBox="0 0 444 444" overflow="hidden"><image href="data:image/webp;base64," width="444" height="444"/></svg></g><g id="art"><use href="#source"/></g><radialGradient id="light"><stop stop-color="#ffdc90" stop-opacity=".7"/><stop offset="1" stop-color="#ffdc90" stop-opacity="0"/></radialGradient></defs><g style="transform-origin:480px 820px;animation:sway 3.6s ease-in-out infinite"><ellipse class="halo" cx="475" cy="410" rx="370" ry="360" fill="url(#light)" style="opacity:.12;animation:glow 3.2s ease-in-out infinite"/><use href="#art"/></g></svg>