# AP 레슨 노트 · 자동 배포
# main 에 올라가면 Firebase(화면·접근 규칙·서버 함수)에 배포한다.
# 인증은 Workload Identity(키 파일 없음): 이 저장소에서 온 요청만 github-deploy 계정으로 배포할 수 있다.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/989405930165/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@ap-lesson-note.iam.gserviceaccount.com
      - name: 서버 함수 패키지 설치
        run: npm install --prefix functions
      - name: Firebase 배포
        run: npx --yes firebase-tools@14 deploy --project ap-lesson-note --non-interactive --force
